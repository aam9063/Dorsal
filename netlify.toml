[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "11.4.0"

[dev]
  command = "pnpm dev"
  targetPort = 5173

# Client-side routing: /subir and /resultado are not files on disk.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The shipped CSP, measured against the production build (H-12 decision 3).
# Every claim below was observed by serving `dist` with these exact headers and
# running the full flow (upload, eight stories, both card exports):
# - `script-src 'self'` holds: the build inlines no script — `dist/index.html`
#   carries one module tag with `src` and one stylesheet link. The single
#   `script-src` violation in the console is Zod's `isEvalSupported()` probe
#   (`Function('')` inside a try/catch); it is blocked, returns false, and Zod
#   falls back to its interpreted validator, so nothing breaks.
# - `style-src` keeps `'unsafe-inline'` because the animation layer injects
#   seven `<style>` elements during the story transitions. That is measured, not
#   assumed: with `style-src 'self'` those seven are blocked and the transitions
#   lose their styles, while `style-src-attr` alone does not cover elements.
# - `worker-src 'self'` is enough: Vite emits the worker as an asset file
#   (`new Worker(new URL('/assets/worker…'))`), so no blob: worker is created.
# - `connect-src 'self'` is the promise of the product: the file never leaves
#   the browser, so no other origin may be contacted.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=()"
    Cross-Origin-Opener-Policy = "same-origin"
