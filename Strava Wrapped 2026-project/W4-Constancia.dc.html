<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var colors = ['#24261F', '#6B2A0E', '#B83D07', '#FC5200'];
var weekdayP = [0.55, 0.85, 0.6, 0.85, 0.35, 0.7, 0.95];
var days = [];
for (var i = 0; i < 365; i++) {
var w = i % 7;
var p = weekdayP[w];
if (i >= 212 && i <= 242) p = p * 0.3;
var r = ((i * 9301 + 49297) % 233280) / 233280;
var active = r < p || (i >= 61 && i <= 83);
var level = active ? 1 + Math.floor(((i * 7919) % 100) / 34) : 0;
if (level > 3) level = 3;
days.push({ bg: colors[level] });
}
return { firstHalf: days.slice(0, 182), secondHalf: days.slice(182) };
}
}
</script>
