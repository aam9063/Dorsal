name: CI

# Feature branches are covered by their pull request, so only the branches
# that get merged into run on push: one verification per commit instead of two.
on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    # Browsers and the ~200 apt packages WebKit needs are already in this image,
    # so no install step exists. The tag must match playwright in pnpm-lock.yaml:
    # a mismatch fails the run immediately instead of silently testing another
    # version.
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-jammy
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm fixtures
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
