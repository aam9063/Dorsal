name: CI

# Feature branches are covered by their pull request, so only the branches
# that get merged into run on push: one verification per commit instead of two.
on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm fixtures
      # WebKit pulls ~200 apt packages. That normally takes ~1.5 min, but one
      # run took 13 min on a slow Ubuntu mirror, so the step is bounded instead
      # of being allowed to sit there.
      - name: Install Playwright browsers and their system packages
        run: pnpm exec playwright install --with-deps chromium webkit
        timeout-minutes: 20
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
