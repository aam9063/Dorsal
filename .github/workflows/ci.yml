name: CI

on:
  push:
    branches:
      - main
      - dev
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm fixtures
      # WebKit pulls ~200 apt packages; downloading them costs ~13 min per
      # cold run, so the archive cache lives in a directory the runner owns.
      - name: Point the apt archive cache at a cacheable directory
        run: |
          mkdir -p "$HOME/apt-archives"
          echo 'Dir::Cache::archives "/home/runner/apt-archives";' | sudo tee /etc/apt/apt.conf.d/99-dorsal-apt-cache
      - name: Restore the apt package cache
        uses: actions/cache@v6
        with:
          path: /home/runner/apt-archives
          key: apt-playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            apt-playwright-${{ runner.os }}-
      - name: Install Playwright browsers and their system packages
        run: pnpm exec playwright install --with-deps chromium webkit
        timeout-minutes: 20
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
